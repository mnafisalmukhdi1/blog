<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="mnafisalmukhdi1">
	<!-- Facebook Meta Tags -->
	<meta property="og:url" content="{{ site.url }}">
	<meta property="og:type" content="website">
	<meta property="og:title" content="{{page.title}} | {{site.title}}">
	<meta property="og:description" content="">
	<meta property="og:image" content="https://image.thum.io/get/maxAge/12/width/700/https://blog.nafis1.my.id">
	<!-- Twitter Meta Tags -->
	<meta name="twitter:card" content="summary_large_image">
	<meta property="twitter:domain" content="blog.nafis1.my.id">
	<meta property="twitter:url" content="{{site.url}}">
	<meta name="twitter:title" content="{{page.title}} | {{site.title}}">
	<meta name="twitter:description" content="">
	<meta name="twitter:image" content="https://image.thum.io/get/maxAge/12/width/700/https://blog.nafis1.my.id">
	<title>{{page.title}} | {{site.title}}</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<style>
	/* Fallback heading styles if Tailwind components aren't compiled */
	.prose h1 { font-size: 2.25rem; font-weight:700; line-height:1.2; letter-spacing:-0.02em; margin:0 0 0.5rem; }
	.prose h2 { font-size: 1.75rem; font-weight:600; letter-spacing:-0.02em; margin-top:2rem; margin-bottom:1rem;}
	.prose h3 { font-size: 1.5rem; font-weight:500; letter-spacing:-0.01em; margin-top:1.5rem; margin-bottom:0.75rem;}
	.prose blockquote { border-left:2px solid rgba(19, 78, 74, 0.6); padding-left:1rem; color:#4b5563; font-style:italic; margin:1rem 0; }
	@media (prefers-color-scheme: dark) {
		.prose blockquote { border-left-color:rgba(94, 234, 212, 0.5); color:#cbd5e1; }
	}
	/* Arabic improvements */
	.arabic { font-family: 'Amiri', serif; direction: rtl; unicode-bidi: embed; }
	</style>
	<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" media="all">
	<script>
	// Auto-detect Arabic text inside .prose and mark it for RTL + font
	document.addEventListener('DOMContentLoaded', function(){
	  const arabicRegex = /[\u0600-\u06FF]/;
	  document.querySelectorAll('.prose *').forEach(el => {
	    if (el.children.length === 0 && arabicRegex.test(el.textContent.trim())) {
	      el.classList.add('arabic');
	      el.setAttribute('dir','rtl');
	    }
	  });
	});
	</script>
	<link rel="shortcut icon" href="https://nafis1.my.id/favicon.ico" type="image/x-icon">
	<link rel="icon" href="https://nafis1.my.id/favicon.ico" type="image/x-icon">
	<link rel="canonical" href="https://blog.nafis1.my.id">
	<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.url }}/feed.xml">
</head>
